# ==============================================================================
# 1. MONITORES (DISPLAYS)
# ==============================================================================
monitor=HDMI-A-1,preferred,0x0,1
monitor=DP-1,preferred,auto,1
monitor=,preferred,auto,1

# ==============================================================================
# 2. VARIÁVEIS E FONTES
# ==============================================================================
source = ~/.config/hypr/colors.conf
$mainMod = SUPER
bind = SUPER, T, exec, quickshell ipc call settings toggle
$terminal = /usr/bin/ghostty
$fileManager = thunar
$menu = vicinae toggle

exec-once = solaar
exec-once = ~/.config/hypr/portal.sh
exec-once = awww-daemon
exec-once = ~/.config/quickshell/scripts/launch.sh
exec-once = fcitx5 -d

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user start hyprland-session.target
exec-once = systemctl --user start graphical-session.target

# Papel de Parede
exec-once = hyprpaper

# Aplicativos
exec-once = discord
exec-once = spotify
exec-once = steam
exec-once = vicinae server

# ==============================================================================
# 5. TECLADO E MOUSE (INPUT)
# ==============================================================================
input {
    kb_layout = br
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
}

# ==============================================================================
# 6. APARÊNCIA (LOOK & FEEL)
# ==============================================================================
general {
    gaps_in = 6
    gaps_out = 5
    border_size = 2

    # Bordas com degradê fosco entre o azul gélido discreto e o cinza asfalto
    col.active_border = $destaque1 $destaque2 45deg
    col.inactive_border = $base

    layout = dwindle
}

misc {
    focus_on_activate = true
}

decoration {
    rounding = 14
    active_opacity = 1
    inactive_opacity = 0.95

    # Blur sutil nas janelas sem gerar "neon" nos fundos
    blur {
    enabled = false
        size = 5
        passes = 2
        new_optimizations = true
    }

    # Desativando sombras brilhantes para focar em superfícies puras e foscas
    shadow {
    enabled = false
    }
}

# ==============================================================================
# 7. WORKSPACES
# ==============================================================================
# Workspaces do Monitor Principal (HDMI-A-1)
workspace = 1, monitor:HDMI-A-1, default:true, persistent:true
workspace = 2, monitor:HDMI-A-1, persistent:true
workspace = 3, monitor:HDMI-A-1, persistent:true
workspace = 4, monitor:HDMI-A-1, persistent:true
workspace = 5, monitor:HDMI-A-1, persistent:true

# Workspaces do Monitor Secundário (DP-1)
workspace = 6, monitor:DP-1, default:true, persistent:true
workspace = 7, monitor:DP-1, persistent:true
workspace = 8, monitor:DP-1, persistent:true
workspace = 9, monitor:DP-1, persistent:true
workspace = 10, monitor:DP-1, persistent:true

# ==============================================================================
# 8. REGRAS DE JANELAS (WINDOW RULES)
# ==============================================================================
# Associações de Workspaces
windowrule = match:class .*discord.*, workspace 9
windowrule = match:class .*Spotify.*, workspace 10
windowrule = match:class .*steam.*, workspace 5

# Popups Flutuantes
windowrule {
    name = popup_volume
    match:class = .*pavucontrol.*
    float = 1
    size = 400 300
    move = 100%-410 50
    pin = 1
}

windowrule {
    name = popup_wifi
    match:class = .*nm-connection-editor.*
    float = 1
    size = 400 300
    move = 100%-410 50
    pin = 1
}

windowrule {
    name = popup_bluetooth
    match:class = .*blueman-manager.*
    float = 1
    size = 400 300
    move = 100%-410 50
    pin = 1
}

layerrule {
    name = janela-rss
    match:class = .*janela-rss*
    blur = 0.1
}

layerrule {
    name = vicinae-blur
    blur = on
    ignore_alpha = 0
    match:namespace = vicinae
}
layerrule {
    name = vicinae-no-animation
    no_anim = on
    match:namespace = vicinae
}

# ==============================================================================
# 9. ATALHOS (KEYBINDINGS)
# ==============================================================================
# Aplicativos e Sistema
bind = SUPER, Q, exec, ghostty
bind = SUPER, E, exec, thunar
bind = SUPER, X, exec, ~/.config/hypr/scripts/smart_close.sh
bindr = SUPER, SUPER_L, exec, vicinae toggle
bind = SUPER, V, exec, vicinae deeplink vicinae://launch/clipboard/history
bind = SUPER, H, exec, zen
bind = SUPER, C, exec, code

# Captura de Tela (Satty - anotações estilo Lightshot)
bind = , Print, exec, grim -g "$(slurp)" - | satty --filename - --fullscreen
bind = SUPER SHIFT, s, exec, grim -g "$(slurp)" - | satty --filename - --fullscreen

# Gerenciamento de Janelas e Layout
bind = SUPER, Z, togglefloating,


bind = SUPER, left, exec, ~/.config/hypr/scripts/workspace_cycle.sh prev
bind = SUPER, right, exec, ~/.config/hypr/scripts/workspace_cycle.sh next

bind = SUPER, down, movetoworkspace, e-1
bind = SUPER, up, movetoworkspace, e+1
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Mover Janelas para Workspaces Específicos
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Controle pelo Mouse (Arrastar e Redimensionar)
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# ==============================================================================
# 10. CONTROLE DE MÍDIA E VOLUME
# ==============================================================================
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 2%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl --player=spotify,%any play-pause
bindl = , XF86AudioPause, exec, playerctl --player=spotify,%any play-pause
bindl = , XF86AudioNext, exec, playerctl --player=spotify,%any next
bindl = , XF86AudioPrev, exec, playerctl --player=spotify,%any previous